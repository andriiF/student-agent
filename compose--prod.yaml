services:
    php:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        container_name: student-agent-php-backend
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            - database
        networks:
            - app-network

    nginx:
        image: nginx:alpine
        container_name: student-agent-nginx
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
        networks:
            - app-network
            - gateway

    database:
        image: postgres:16-alpine
        container_name: student-agent-db
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - database_data:/var/lib/postgresql/data
        networks:
            - app-network
    redis-cache:
        image: redis:6.2-alpine
        container_name: student-agent-cache
        restart: always
        ports:
            - '6379:6379'
        command: redis-server --save 20 1 --loglevel warning
        volumes:
            - cache:/data
        networks:
            - app-network

    js:
      image: node:24-alpine
      container_name: student-agent-js
      working_dir: /var/www/html
      volumes:
        - ./:/var/www/html
      command: sh -c "npm ci && npm run build && rm -f public/hot"
      networks:
        - app-network
      profiles:
        - build
      deploy:
        resources:
          limits:
            cpus: "2.0"
            memory: 2G
          reservations:
            cpus: "0.25"
            memory: 256M

networks:
    app-network:
        driver: bridge
    gateway:
      external: true

volumes:
    database_data:
    cache:
        driver: local
